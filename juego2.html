<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Adjectives Challenge - English Kids Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            min-height: 100vh;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .bounce-click:active {
            transform: scale(0.97);
        }

        select.adjective-select {
            background-color: #f8fafc;
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 4px 12px;
            font-weight: bold;
            color: #1e3a8a;
            outline: none;
            transition: all 0.2s;
        }
        select.adjective-select:focus {
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: none !important; width: 100% !important; }
        }
    </style>
</head>
<body class="text-slate-800" onclick="userGestureAudio()">

    <!-- BARRA SUPERIOR CON CONTROL DE MÚSICA SINCRONIZADA -->
    <header class="w-full max-w-xl bg-white/90 backdrop-blur-md border-b-4 border-yellow-400 rounded-2xl px-4 py-3 shadow-md mb-4 flex justify-between items-center no-print">
        <a href="index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition-all flex items-center gap-2" onclick="event.stopPropagation()">
            🏠 Menú Principal
        </a>

        <div class="flex items-center gap-3">
            <button id="bgm-btn" onclick="event.stopPropagation(); toggleGameBGM();" class="bg-pink-500 hover:bg-pink-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">
                🎵 Music: OFF
            </button>
            <div class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-xl font-bold text-sm">
                ⭐ <span id="score">0</span>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
    <div id="game-card-container" class="glass-card rounded-3xl p-6 w-full max-w-xl shadow-xl print-card">
        
        <div class="flex justify-between items-center mb-4">
            <span id="progress-indicator" class="bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-xs uppercase">Animal 1 de 6</span>
            <h2 id="animal-title" class="text-2xl font-bold text-indigo-700">Animal</h2>
        </div>

        <!-- FOTO NÍTIDA Y CLARA (SIN DESENFOQUE) -->
        <div class="w-full h-60 rounded-2xl overflow-hidden relative mb-4 bg-slate-200 shadow-inner border-2 border-white">
            <img id="animal-photo" class="w-full h-full object-cover" src="" alt="Animal">
        </div>

        <!-- ÁREA DE FRASES DINÁMICAS CON HUECOS -->
        <div class="bg-sky-50 border-2 border-dashed border-sky-300 rounded-2xl p-5 mb-5">
            <span class="text-xs font-bold text-sky-600 uppercase tracking-wider block mb-2">Complete the sentence:</span>
            <p id="sentence-container" class="text-sky-950 font-semibold text-lg leading-relaxed">Cargando...</p>
        </div>

        <div id="feedback-msg" class="text-center font-bold mb-4 h-6 text-sm"></div>

        <div class="flex gap-3">
            <button id="check-btn" onclick="checkCurrentActivity()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow-md text-lg bounce-click transition-all">
                ✨ Check Answer
            </button>
            <button id="next-btn" onclick="nextActivity()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-2xl shadow-md text-lg hidden bounce-click transition-all">
                Siguiente Animal ➡️
            </button>
        </div>
    </div>

    <!-- PANTALLA FINAL DE RESULTADOS Y REVISIÓN PARA EL PROFESOR -->
    <section id="results-view" class="hidden glass-card rounded-3xl p-8 w-full max-w-xl shadow-xl border-4 border-emerald-300 print-card">
        <div class="text-center mb-6">
            <div class="text-5xl mb-2">🏆</div>
            <h2 class="text-2xl font-bold text-emerald-700">Animal Adjectives Report</h2>
            <p class="text-slate-600 text-sm">Informe de resultados para evaluación del profesor</p>
            
            <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3 text-left no-print">
                <div>
                    <label class="text-xs font-bold text-slate-600">Student Name / Nombre:</label>
                    <input type="text" id="student-name" placeholder="Escribe tu nombre..." class="w-full mt-1 p-2 border-2 border-slate-200 rounded-xl text-sm font-semibold">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Class / Clase:</label>
                    <input type="text" id="student-class" placeholder="Ej. 3º Primaria A" class="w-full mt-1 p-2 border-2 border-slate-200 rounded-xl text-sm font-semibold">
                </div>
            </div>

            <div class="mt-5 inline-block bg-yellow-100 text-yellow-800 font-bold px-4 py-2 rounded-2xl text-lg">
                Puntuación Final: <span id="final-score-10">0.00</span> / 10 (<span id="final-correct">0</span> aciertos)
            </div>
        </div>

        <div class="mb-6">
            <h3 class="font-bold text-slate-700 mb-3 text-sm">Desglose de respuestas del alumno:</h3>
            <div id="results-list" class="space-y-3 max-h-64 overflow-y-auto pr-2"></div>
        </div>

        <div class="flex gap-3 no-print">
            <button onclick="downloadPDF()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                <span>📥 Descargar Informe en PDF</span>
            </button>
            <a href="index.html" class="bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-md text-center flex items-center justify-center text-sm">
                🏠 Salir al Menú
            </a>
        </div>
    </section>

    <!-- LIBRERÍA PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        const adjectiveOptions = ['big', 'small', 'short', 'tall', 'long'];

        // Banco de frases múltiples por animal para que varíen aleatoriamente al reiniciar
        const animalsData = [
            {
                name: "Dolphin",
                image: "image_0.png",
                variants: [
                    { template: "A dolphin is a [BLANK] animal that swims in the ocean with a [BLANK] body.", answers: ["big", "long"] },
                    { template: "In the sea, a dolphin has a [BLANK] body and is definitely not [BLANK].", answers: ["long", "small"] }
                ]
            },
            {
                name: "Snake",
                image: "image_1.png",
                variants: [
                    { template: "A snake has a [BLANK] body and is very [BLANK] compared to large mammals.", answers: ["long", "small"] },
                    { template: "The snake moves along the ground because its body is [BLANK] and it has no legs.", answers: ["long"] }
                ]
            },
            {
                name: "Lizard",
                image: "image_2.png",
                variants: [
                    { template: "A lizard is a [BLANK] animal with [BLANK] legs and a tail.", answers: ["small", "short"] },
                    { template: "You can find lizards on rocks; they are [BLANK] creatures with [BLANK] legs.", answers: ["small", "short"] }
                ]
            },
            {
                name: "Parrot",
                image: "image_3.png",
                variants: [
                    { template: "A parrot is a [BLANK] bird with colorful feathers and [BLANK] legs.", answers: ["small", "short"] },
                    { template: "Unlike big eagles, a parrot is a [BLANK] animal.", answers: ["small"] }
                ]
            },
            {
                name: "Butterfly",
                image: "image_4.png",
                variants: [
                    { template: "A butterfly is a very [BLANK] insect with beautiful wings.", answers: ["small"] },
                    { template: "Fluttering in the garden, the butterfly has a [BLANK] body and is very light.", answers: ["small"] }
                ]
            },
            {
                name: "Scorpion",
                image: "image_5.png",
                variants: [
                    { template: "A scorpion is a [BLANK] desert animal with a [BLANK] tail and a sting.", answers: ["small", "long"] },
                    { template: "Watch out for the scorpion! It is [BLANK] and has a [BLANK] tail.", answers: ["small", "long"] }
                ]
            }
        ];

        let sessionChallenges = [];
        let currentIndex = 0;
        let score = 0;
        let userReport = [];
        let activitySubmitted = false;

        // Seleccionar aleatoriamente una variante de frase para cada animal al iniciar la partida
        function initGameSession() {
            sessionChallenges = animalsData.map(animal => {
                const randomVariant = animal.variants[Math.floor(Math.random() * animal.variants.length)];
                return {
                    name: animal.name,
                    image: animal.image,
                    template: randomVariant.template,
                    answers: randomVariant.answers
                };
            });
        }

        // Sistema de Audio Sincronizado
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function userGestureAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const bgmNotes = [261.63, 329.63, 392.00, 329.63, 349.23, 440.00, 392.00, 329.63];
        let noteIdx = 0;

        function playBgmStep() {
            if (!isBgmPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(bgmNotes[noteIdx], now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            noteIdx = (noteIdx + 1) % bgmNotes.length;
        }

        function toggleGameBGM() {
            initAudio();
            isBgmPlaying = !isBgmPlaying;
            localStorage.setItem('bgmPlaying', isBgmPlaying);
            updateBgmButton();
        }

        function updateBgmButton() {
            const btn = document.getElementById('bgm-btn');
            if (isBgmPlaying) {
                btn.innerText = "🎵 Music: ON";
                btn.classList.replace('bg-pink-500', 'bg-emerald-500');
                if (!bgmInterval) bgmInterval = setInterval(playBgmStep, 250);
            } else {
                btn.innerText = "🎵 Music: OFF";
                btn.classList.replace('bg-emerald-500', 'bg-pink-500');
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAudio();
            if (localStorage.getItem('bgmPlaying') === 'true') {
                isBgmPlaying = true;
                updateBgmButton();
            }
            initGameSession();
            loadActivity();
        });

        function playSound(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function renderSentence(challenge) {
            let parts = challenge.template.split('[BLANK]');
            let html = parts[0];
            for (let i = 0; i < challenge.answers.length; i++) {
                let selectId = `blank-${i}`;
                let optionsHtml = `<select id="${selectId}" class="adjective-select">`;
                optionsHtml += `<option value="">-- select --</option>`;
                let shuffledOptions = [...adjectiveOptions].sort(() => Math.random() - 0.5);
                shuffledOptions.forEach(opt => {
                    optionsHtml += `<option value="${opt}">${opt}</option>`;
                });
                optionsHtml += `</select>`;
                html += optionsHtml + parts[i + 1];
            }
            return html;
        }

        function loadActivity() {
            activitySubmitted = false;
            const challenge = sessionChallenges[currentIndex];
            
            document.getElementById('progress-indicator').innerText = `Animal ${currentIndex + 1} de${sessionChallenges.length}`;
            document.getElementById('animal-title').innerText = challenge.name;
            document.getElementById('animal-photo').src = challenge.image;

            document.getElementById('sentence-container').innerHTML = renderSentence(challenge);

            document.getElementById('feedback-msg').innerText = "";
            document.getElementById('check-btn').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkCurrentActivity() {
            if (activitySubmitted) return;
            
            const challenge = sessionChallenges[currentIndex];
            let userVals = [];
            let allAnswered = true;

            for (let i = 0; i < challenge.answers.length; i++) {
                let val = document.getElementById(`blank-${i}`).value;
                if (!val) allAnswered = false;
                userVals.push(val);
            }

            if (!allAnswered) {
                const fb = document.getElementById('feedback-msg');
                fb.style.color = "#d97706";
                fb.innerText = "⚠️ Please answer all blanks before checking!";
                playSound('wrong');
                return;
            }

            activitySubmitted = true;
            document.querySelectorAll('.adjective-select').forEach(sel => sel.disabled = true);

            let correctCount = 0;
            let evalDetails = challenge.answers.map((ans, i) => {
                let ok = (userVals[i] === ans);
                if (ok) correctCount++;
                return { user: userVals[i], correct: ans, isOk: ok };
            });

            if (correctCount === challenge.answers.length) {
                score += 10;
                document.getElementById('score').innerText = score;
                playSound('correct');
                document.getElementById('feedback-msg').style.color = "#16a34a";
                document.getElementById('feedback-msg').innerText = "✨ Excellent! Correct answers!";
            } else {
                playSound('wrong');
                document.getElementById('feedback-msg').style.color = "#dc2626";
                document.getElementById('feedback-msg').innerText = `👍 Good effort! (${correctCount}/${challenge.answers.length} correct)`;
            }

            userReport.push({
                animal: challenge.name,
                template: challenge.template,
                evalDetails: evalDetails,
                allOk: (correctCount === challenge.answers.length)
            });

            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextActivity() {
            currentIndex++;
            if (currentIndex < sessionChallenges.length) {
                loadActivity();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-card-container').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');

            let totalQuestions = sessionChallenges.length;
            let correctCount = userReport.filter(r => r.allOk).length;
            let score10 = ((correctCount / totalQuestions) * 10).toFixed(2);

            document.getElementById('final-score-10').innerText = score10;
            document.getElementById('final-correct').innerText = `${correctCount} /${totalQuestions}`;

            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            userReport.forEach((rep, idx) => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl border-2 ${rep.allOk ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`;
                
                let sentenceDisplay = rep.template;
                rep.evalDetails.forEach(e => {
                    sentenceDisplay = sentenceDisplay.replace('[BLANK]', `<span class="font-bold ${e.isOk ? 'text-emerald-60
