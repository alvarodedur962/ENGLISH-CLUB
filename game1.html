<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Animal - Blurred Image Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #FF9F43;
            --success: #2ECC71;
            --danger: #EE5253;
            --bg: #F0F4F8;
            --text: #2D3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 600px;
            padding: 24px;
            text-align: center;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: #E2E8F0;
            color: var(--text);
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: #CBD5E0;
        }

        .stars-badge {
            background: #FEF08A;
            color: #854D0E;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
        }

        .question-box {
            background: #EBF8FF;
            border: 2px dashed #90CDF4;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .question-box h2 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        .clue-text {
            font-size: 1.15rem;
            color: #2B6CB0;
            font-weight: 700;
        }

        .image-container {
            width: 100%;
            height: 250px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            background: #E2E8F0;
        }

        .animal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(25px);
            transition: filter 0.8s ease-out, transform 0.5s ease;
            transform: scale(1.1);
        }

        .animal-img.revealed {
            filter: blur(0px);
            transform: scale(1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-btn {
            background: #F7FAFC;
            border: 3px solid #E2E8F0;
            border-radius: 16px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Fredoka One', cursive;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #EBF8FF;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #DEF7EC;
            border-color: var(--success);
            color: #03543F;
        }

        .option-btn.wrong {
            background: #FDE8E8;
            border-color: var(--danger);
            color: #9B1C1C;
        }

        .next-btn {
            margin-top: 18px;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            width: 100%;
            box-shadow: 0 4px 12px rgba(255, 159, 67, 0.4);
        }

        .next-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="top-bar">
            <a href="index.html" class="btn-back">🏠 Back to Menu</a>
            <div class="stars-badge">⭐ Stars: <span id="score">0</span></div>
        </div>

        <div class="question-box">
            <h2>Guess the Animal! 🔍</h2>
            <p class="clue-text" id="clue">Loading question...</p>
        </div>

        <div class="image-container">
            <img id="animal-photo" class="animal-img" src="" alt="Blurred Animal">
        </div>

        <div class="options-grid" id="options-container">
            <!-- Buttons dynamically generated -->
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Animal ➡️</button>
    </div>

    <script>
        const questions = [
            {
                clue: 'I am a BIG animal with a LONG body. I swim in the ocean!',
                correct: 'Dolphin',
                image: 'https://images.unsplash.com/photo-1570481662006-a3a1374699e8?w=800&auto=format&fit=crop',
                options: ['Dolphin', 'Frog', 'Lizard', 'Parrot']
            },
            {
                clue: 'I am a LONG animal with NO legs. I can be GREEN or BROWN!',
                correct: 'Snake',
                image: 'https://images.unsplash.com/photo-1531386151447-fd76ad50012f?w=800&auto=format&fit=crop',
                options: ['Snake', 'Butterfly', 'Dolphin', 'Lizard']
            },
            {
                clue: 'I am a SMALL animal with a LONG tail. I like warm stones!',
                correct: 'Lizard',
                image: 'https://images.unsplash.com/photo-1504450758481-7338eba7524a?w=800&auto=format&fit=crop',
                options: ['Parrot', 'Lizard', 'Frog', 'Snake']
            },
            {
                clue: 'I am a SMALL green animal with LONG legs. I can JUMP!',
                correct: 'Frog',
                image: 'https://images.unsplash.com/photo-1559253664-ca249d4608c6?w=800&auto=format&fit=crop',
                options: ['Frog', 'Dolphin', 'Butterfly', 'Parrot']
            },
            {
                clue: 'I am a SHORT bird with colorful feathers. I live in TALL trees!',
                correct: 'Parrot',
                image: 'https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=800&auto=format&fit=crop',
                options: ['Snake', 'Parrot', 'Lizard', 'Frog']
            },
            {
                clue: 'I am a SMALL, beautiful insect with colorful wings!',
                correct: 'Butterfly',
                image: 'https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=800&auto=format&fit=crop',
                options: ['Butterfly', 'Dolphin', 'Parrot', 'Snake']
            }
        ];

        let currentIndex = 0;
        let score = 0;

        // Web Audio Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function loadQuestion() {
            const q = questions[currentIndex];
            document.getElementById('clue').innerText = `"${q.clue}"`;
            
            const img = document.getElementById('animal-photo');
            img.classList.remove('revealed');
            img.src = q.image;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            document.getElementById('next-btn').style.display = 'none';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const q = questions[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === q.correct) {
                btn.classList.add('correct');
                document.getElementById('animal-photo').classList.add('revealed');
                score += 10;
                document.getElementById('score').innerText = score;
                playSound('correct');
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight correct one
                allBtns.forEach(b => {
                    if (b.innerText === q.correct) b.classList.add('correct');
                });
                document.getElementById('animal-photo').classList.add('revealed');
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                alert(`🎉 Fantastic job! You finished the game with ${score} stars!`);
                currentIndex = 0;
                score = 0;
                document.getElementById('score').innerText = score;
                loadQuestion();
            }
        }

        // Start Game
        loadQuestion();
    </script>
</body>
</html>
