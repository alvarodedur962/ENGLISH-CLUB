<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Adjectives Challenge - English Kids Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            min-height: 100vh;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .bounce-click:active {
            transform: scale(0.97);
        }

        .animal-img {
            filter: blur(25px);
            transition: filter 0.5s ease;
        }
        .animal-img.revealed {
            filter: blur(0px);
        }

        select.adjective-select {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 4px 10px;
            font-weight: bold;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
        }
        select.adjective-select:focus {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: none !important; width: 100% !important; }
        }
    </style>
</head>
<body class="text-slate-800" onclick="userGestureAudio()">

    <!-- BARRA SUPERIOR CON CONTROL DE MÚSICA SINCRONIZADA -->
    <header class="w-full max-w-2xl bg-white/90 backdrop-blur-md border-b-4 border-yellow-400 rounded-2xl px-4 py-3 shadow-md mb-4 flex justify-between items-center no-print">
        <a href="index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition-all flex items-center gap-2" onclick="event.stopPropagation()">
            🏠 Menú Principal
        </a>

        <div class="flex items-center gap-3">
            <button id="bgm-btn" onclick="event.stopPropagation(); toggleGameBGM();" class="bg-pink-500 hover:bg-pink-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">
                🎵 Music: OFF
            </button>
            <div class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-xl font-bold text-sm">
                ⭐ <span id="score">0</span> / 18
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
    <div id="game-card-container" class="glass-card rounded-3xl p-6 w-full max-w-2xl shadow-xl print-card">
        
        <div class="flex justify-between items-center mb-4">
            <span id="progress-indicator" class="bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full text-xs uppercase">Animal 1 de 6</span>
            <h2 id="animal-title" class="text-2xl font-bold text-emerald-700">Dolphin</h2>
        </div>

        <div class="w-full h-56 rounded-2xl overflow-hidden relative mb-5 bg-slate-200 shadow-inner">
            <img id="animal-photo" class="animal-img w-full h-full object-cover transform scale-110" src="" alt="Animal">
        </div>

        <!-- ÁREA DE FRASES REALISTAS CON HUECOS -->
        <div class="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-5 mb-5 space-y-4">
            <div>
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Sentence 1:</span>
                <p id="sentence-1" class="text-emerald-950 font-semibold text-lg mt-1 leading-relaxed">Cargando...</p>
            </div>
            <div>
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Sentence 2:</span>
                <p id="sentence-95 font-semibold text-lg mt-1 leading-relaxed" class="text-emerald-950 font-semibold text-lg mt-1 leading-relaxed" id="sentence-2">Cargando...</p>
            </div>
        </div>

        <div id="feedback-msg" class="text-center font-bold mb-4 h-6 text-sm"></div>

        <div class="flex gap-3">
            <button id="check-btn" onclick="checkCurrentActivity()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow-md text-lg bounce-click transition-all">
                ✨ Check Answers
            </button>
            <button id="next-btn" onclick="nextActivity()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-2xl shadow-md text-lg hidden bounce-click transition-all">
                Siguiente Animal ➡️
            </button>
        </div>
    </div>

    <!-- PANTALLA FINAL DE RESULTADOS Y REVISIÓN -->
    <section id="results-view" class="hidden glass-card rounded-3xl p-8 w-full max-w-2xl shadow-xl border-4 border-emerald-300 print-card">
        <div class="text-center mb-6">
            <div class="text-5xl mb-2">🏆</div>
            <h2 class="text-2xl font-bold text-emerald-700">Animal Adjectives — Game Report</h2>
            <p class="text-slate-600 text-sm">Informe detallado para evaluación del profesor</p>
            
            <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3 text-left no-print">
                <div>
                    <label class="text-xs font-bold text-slate-600">Student Name / Nombre del alumno:</label>
                    <input type="text" id="student-name" placeholder="Escribe tu nombre..." class="w-full mt-1 p-2 border-2 border-slate-200 rounded-xl text-sm font-semibold">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Class / Clase:</label>
                    <input type="text" id="student-class" placeholder="Ej. 3º Primaria A" class="w-full mt-1 p-2 border-2 border-slate-200 rounded-xl text-sm font-semibold">
                </div>
            </div>

            <div class="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-200">
                    <div class="text-xs text-indigo-600 font-bold">Final Score</div>
                    <div id="final-score-10" class="text-xl font-bold text-indigo-800">0.00 / 10</div>
                </div>
                <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200">
                    <div class="text-xs text-emerald-600 font-bold">Correct</div>
                    <div id="final-correct" class="text-xl font-bold text-emerald-800">0</div>
                </div>
                <div class="bg-rose-50 p-3 rounded-2xl border border-rose-200">
                    <div class="text-xs text-rose-600 font-bold">Incorrect</div>
                    <div id="final-incorrect" class="text-xl font-bold text-rose-800">0</div>
                </div>
                <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200">
                    <div class="text-xs text-amber-600 font-bold">Empty</div>
                    <div id="final-empty" class="text-xl font-bold text-amber-800">0</div>
                </div>
            </div>
        </div>

        <div class="mb-6">
            <h3 class="font-bold text-slate-700 mb-3 text-sm">Desglose de errores y revisión detallada:</h3>
            <div id="results-list" class="space-y-3 max-h-72 overflow-y-auto pr-2"></div>
        </div>

        <div class="flex gap-3 no-print">
            <button onclick="downloadPDF()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                <span>📥 Descargar Informe en PDF</span>
            </button>
            <a href="index.html" class="bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-md text-center flex items-center justify-center text-sm">
                🏠 Salir al Menú
            </a>
        </div>
    </section>

    <!-- LIBRERÍA PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        const adjectiveOptions = ['long', 'small', 'tall', 'big', 'short'];

        const activities = [
            {
                name: "Dolphin",
                image: "image_0.png",
                s1Template: "A dolphin is a [BLANK] animal with a [BLANK] body.",
                s1Answers: ["big", "long"],
                s2Template: "Compared to insects, a dolphin is not [BLANK].",
                s2Answers: ["small"]
            },
            {
                name: "Snake",
                image: "image_1.png",
                s1Template: "A snake has a [BLANK] body and is very [BLANK].",
                s1Answers: ["long", "small"],
                s2Template: "It does not have [BLANK] legs because it has no legs at all.",
                s2Answers: ["tall"]
            },
            {
                name: "Lizard",
                image: "image_2.png",
                s1Template: "A lizard is a [BLANK] animal with [BLANK] legs.",
                s1Answers: ["small", "short"],
                s2Template: "It has a [BLANK] tail to balance its body.",
                s2Answers: ["long"]
            },
            {
                name: "Parrot",
                image: "image_3.png",
                s1Template: "A parrot is a [BLANK] bird with [BLANK] legs.",
                s1Answers: ["small", "short"],
                s2Template: "It is not a [BLANK] animal like an elephant.",
                s2Answers: ["big"]
            },
            {
                name: "Butterfly",
                image: "image_4.png",
                s1Template: "A butterfly is a [BLANK] insect with a [BLANK] body.",
                s1Answers: ["small", "short"],
                s2Template: "It is very light and not [BLANK].",
                s2Answers: ["big"]
            },
            {
                name: "Scorpion",
                image: "image_5.png",
                s1Template: "A scorpion is a [BLANK] animal with a [BLANK] body.",
                s1Answers: ["small", "short"],
                s2Template: "It has a [BLANK] tail with a sharp sting.",
                s2Answers: ["long"]
            }
        ];

        let currentIndex = 0;
        let totalCorrect = 0;
        let userReport = [];
        let activitySubmitted = false;

        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function userGestureAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const bgmNotes = [261.63, 329.63, 392.00, 329.63, 349.23, 440.00, 392.00, 329.63];
        let noteIdx = 0;

        function playBgmStep() {
            if (!isBgmPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(bgmNotes[noteIdx], now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            noteIdx = (noteIdx + 1) % bgmNotes.length;
        }

        function toggleGameBGM() {
            initAudio();
            isBgmPlaying = !isBgmPlaying;
            localStorage.setItem('bgmPlaying', isBgmPlaying);
            updateBgmButton();
        }

        function updateBgmButton() {
            const btn = document.getElementById('bgm-btn');
            if (isBgmPlaying) {
                btn.innerText = "🎵 Music: ON";
                btn.classList.replace('bg-pink-500', 'bg-emerald-500');
                if (!bgmInterval) bgmInterval = setInterval(playBgmStep, 250);
            } else {
                btn.innerText = "🎵 Music: OFF";
                btn.classList.replace('bg-emerald-500', 'bg-pink-500');
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAudio();
            if (localStorage.getItem('bgmPlaying') === 'true') {
                isBgmPlaying = true;
                updateBgmButton();
            }
            loadActivity();
        });

        function playSound(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function renderSentenceWithSelects(template, answers, selectIdPrefix) {
            let parts = template.split('[BLANK]');
            let html = parts[0];
            for (let i = 0; i < answers.length; i++) {
                let selectId = `${selectIdPrefix}-${i}`;
                let optionsHtml = `<select id="${selectId}" class="adjective-select">`;
                optionsHtml += `<option value="">-- select --</option>`;
                let shuffledOptions = [...adjectiveOptions].sort(() => Math.random() - 0.5);
                shuffledOptions.forEach(opt => {
                    optionsHtml += `<option value="${opt}">${opt}</option>`;
                });
                optionsHtml += `</select>`;
                html += optionsHtml + parts[i + 1];
            }
            return html;
        }

        function loadActivity() {
            activitySubmitted = false;
            const act = activities[currentIndex];
            
            document.getElementById('progress-indicator').innerText = `Animal ${currentIndex + 1} de ${activities.length}`;
            document.getElementById('animal-title').innerText = act.name;
            
            const img = document.getElementById('animal-photo');
            img.classList.remove('revealed');
            img.src = act.image;

            document.getElementById('sentence-1').innerHTML = renderSentenceWithSelects(act.s1Template, act.s1Answers, 's1');
            document.getElementById('sentence-2').innerHTML = renderSentenceWithSelects(act.s2Template, act.s2Answers, 's2');

            document.getElementById('feedback-msg').innerText = "";
            document.getElementById('check-btn').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkCurrentActivity() {
            if (activitySubmitted) return;
            
            const act = activities[currentIndex];
            let s1User = [];
            let s2User = [];
            let allAnswered = true;

            for (let i = 0; i < act.s1Answers.length; i++) {
                let val = document.getElementById(`s1-${i}`).value;
                if (!val) allAnswered = false;
                s1User.push(val);
            }

            for (let i = 0; i < act.s2Answers.length; i++) {
                let val = document.getElementById(`s2-${i}`).value;
                if (!val) allAnswered = false;
                s2User.push(val);
            }

            if (!allAnswered) {
                const fb = document.getElementById('feedback-msg');
                fb.style.color = "#d97706";
                fb.innerText = "⚠️ Please answer all blanks before checking!";
                playSound('wrong');
                return;
            }

            activitySubmitted = true;
            document.querySelectorAll('.adjective-select').forEach(sel => sel.disabled = true);

            let correctCount = 0;
            let totalActivityBlanks = act.s1Answers.length + act.s2Answers.length;

            let s1Eval = act.s1Answers.map((ans, i) => {
                let ok = (s1User[i] === ans);
                if (ok) correctCount++;
                return { user: s1User[i], correct: ans, isOk: ok };
            });

            let s2Eval = act.s2Answers.map((ans, i) => {
                let ok = (s2User[i] === ans);
                if (ok) correctCount++;
                return { user: s2User[i], correct: ans, isOk: ok };
            });

            totalCorrect += correctCount;
            document.getElementById('score').innerText = totalCorrect;

            userReport.push({
                animal: act.name,
                image: act.image,
                s1Text: act.s1Template,
                s1Eval: s1Eval,
                s2Text: act.s2Template,
                s2Eval: s2Eval,
                activityCorrect: correctCount,
                activityTotal: totalActivityBlanks
            });

            document.getElementById('animal-photo').classList.add('revealed');
            const fb = document.getElementById('feedback-msg');
            
            if (correctCount === totalActivityBlanks) {
                fb.style.color = "#16a34a";
                fb.innerText = "✨ Excellent! All answers are correct!";
                playSound('correct');
            } else {
                fb.style.color = "#dc2626";
                fb.innerText = `👍 Good effort! You got ${correctCount} of ${totalActivityBlanks} correct.`;
                playSound('wrong');
            }

            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextActivity() {
            currentIndex++;
            if (currentIndex < activities.length) {
                loadActivity();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-card-container').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');

            let totalBlanks = 18;
            let correct = totalCorrect;
            let incorrect = 0;
            let empty = 0;

            userReport.forEach(item => {
                item.s1Eval.forEach(e => {
                    if (!e.user) empty++;
                    else if (!e.isOk) incorrect++;
                });
                item.s2Eval.forEach(e => {
                    if (!e.user) empty++;
                    else if (!e.isOk) incorrect++;
                });
            });

            let score10 = (correct / totalBlanks) * 10;
            score10 = Math.min(10, Math.max(0, score10)).toFixed(2);

            document.getElementById('final-score-10').innerText = `${score10} / 10`;
            document.getElementById('final-correct').innerText = correct;
            document.getElementById('final-incorrect').innerText = incorrect;
            document.getElementById('final-empty').innerText = empty;

            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            userReport.forEach((rep, idx) => {
                let allOk = rep.s1Eval.every(e => e.isOk) && rep.s2Eval.every(e => e.isOk);
                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl border-2 ${allOk ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`;
                
                let htmlContent = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-xs text-indigo-700">Animal ${idx + 1}: ${rep.animal}</span>
                        <span>${allOk ? '✅ Perfect' : '❌ Needs Review'}</span>
                    </div>
                    <p class="text-xs text-slate-600"><b>S1:</b> ${rep.s1Text.replace('[BLANK]', `<span class="text-blue-600 font-bold">[${rep.s1Eval[0].user || 'empty'}]</span>`).replace('[BLANK]', `<span class="text-blue-600 font-bold">[${rep.s1Eval[1]?.user || 'empty'}]</span>`)}</p>
                    <p class="text-xs text-slate-600 mt-1"><b>S2:</b> ${rep.s2Text.replace('[BLANK]', `<span class="text-blue-600 font-bold">[${rep.s2Eval[0].user || 'empty'}]</span>`)}</p>
                `;
                if (!allOk) {
                    htmlContent += `<div class="mt-2 text-xs text-rose-700 bg-rose-100 p-2 rounded-xl">Correct adjectives: <b>S1: (${rep.s1Eval.map(e => e.correct).join(', ')}) | S2: (${rep.s2Eval.map(e => e.correct).join(', ')})</b></div>`;
                }
                item.innerHTML = htmlContent;
                listContainer.appendChild(item);
            });
        }

        function downloadPDF() {
            const element = document.getElementById('results-view');
            const opt = {
                margin:       10,
                filename:     'Animal_Adjectives_Report.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
