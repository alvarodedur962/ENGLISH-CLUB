<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Adjectives Challenge - English Kids Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            min-height: 100vh;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .bounce-click:active {
            transform: scale(0.97);
        }

        .animal-img {
            filter: blur(0px);
            object-fit: cover;
        }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: none !important; width: 100% !important; }
        }
    </style>
</head>
<body class="text-slate-800" onclick="userGestureAudio()">

    <!-- BARRA SUPERIOR CON CONTROL DE MÚSICA Y RETORNO -->
    <header class="w-full max-w-xl bg-white/90 backdrop-blur-md border-b-4 border-emerald-400 rounded-2xl px-4 py-3 shadow-md mb-4 flex justify-between items-center no-print">
        <a href="index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition-all flex items-center gap-2" onclick="event.stopPropagation()">
            🏠 Main Menu
        </a>

        <div class="flex items-center gap-3">
            <button id="bgm-btn" onclick="event.stopPropagation(); toggleGameBGM();" class="bg-pink-500 hover:bg-pink-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">
                🎵 Music: OFF
            </button>
            <div class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-xl font-bold text-sm">
                ⭐ <span id="score">0</span>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
    <div id="game-card-container" class="glass-card rounded-3xl p-6 w-full max-w-xl shadow-xl print-card">
        
        <div class="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-4 mb-4 text-center">
            <h2 class="text-emerald-700 font-bold text-lg mb-1">Choose the correct adjective! 🧠✨</h2>
            <p id="clue" class="text-emerald-900 font-bold text-2xl tracking-wide">Loading sentence...</p>
        </div>

        <div class="w-full h-64 rounded-2xl overflow-hidden relative mb-4 bg-slate-100 border-2 border-slate-200 shadow-inner flex items-center justify-center">
            <img id="animal-photo" class="animal-img w-full h-full" src="" alt="Animal">
        </div>

        <!-- OPCIONES DE ADJETIVOS -->
        <div id="options-container" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"></div>

        <button id="next-btn" onclick="nextQuestion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow-md text-lg hidden bounce-click">
            Next Sentence ➡️
        </button>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <section id="results-view" class="hidden glass-card rounded-3xl p-8 w-full max-w-xl shadow-xl border-4 border-emerald-300 print-card">
        <div class="text-center mb-6">
            <div class="text-5xl mb-2">🎉</div>
            <h2 class="text-2xl font-bold text-emerald-700">Great Job!</h2>
            <p class="text-slate-600">Results Report (Adjectives Challenge)</p>
            <div class="mt-3 inline-block bg-yellow-100 text-yellow-800 font-bold px-4 py-2 rounded-2xl text-lg">
                Stars: <span id="final-stars">0</span> / 120
            </div>
        </div>

        <div class="mb-6">
            <h3 class="font-bold text-slate-700 mb-3">Your answers:</h3>
            <div id="results-list" class="space-y-3"></div>
        </div>

        <div class="flex gap-3 no-print">
            <button onclick="downloadPDF()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                <span>📥 Download PDF Report</span>
            </button>
            <a href="index.html" class="bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-md text-center flex items-center justify-center">
                🏠 Menu
            </a>
        </div>
    </section>

    <!-- LIBRERÍA PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // Las 12 frases exactas con sus respectivas imágenes (image_0.png a image_5.png)
        const questions = [
            // 1. Dolphin
            { sentenceBefore: "A dolphin is a ", sentenceAfter: " animal.", correct: "big", image: "image_0.png", options: ["big", "short", "tall"] },
            { sentenceBefore: "A dolphin does not have a ", sentenceAfter: " body.", correct: "short", image: "image_0.png", options: ["short", "long", "big"] },
            
            // 2. Scorpion
            { sentenceBefore: "A scorpion is a ", sentenceAfter: " animal.", correct: "small", image: "image_5.png", options: ["small", "long", "tall"] },
            { sentenceBefore: "A scorpion has a ", sentenceAfter: " tail.", correct: "long", image: "image_5.png", options: ["short", "long", "big"] },
            
            // 3. Parrot
            { sentenceBefore: "A parrot is a ", sentenceAfter: " animal.", correct: "small", image: "image_3.png", options: ["big", "small", "tall"] },
            { sentenceBefore: "A parrot has a ", sentenceAfter: " body.", correct: "short", image: "image_3.png", options: ["long", "short", "big"] },
            
            // 4. Lizard
            { sentenceBefore: "A lizard is a ", sentenceAfter: " animal.", correct: "small", image: "image_2.png", options: ["big", "tall", "small"] },
            { sentenceBefore: "A lizard has a ", sentenceAfter: " tail.", correct: "long", image: "image_2.png", options: ["short", "long", "small"] },
            
            // 5. Snake
            { sentenceBefore: "A snake is a ", sentenceAfter: " animal.", correct: "long", image: "image_1.png", options: ["short", "long", "small"] },
            { sentenceBefore: "A snake is not a ", sentenceAfter: " animal.", correct: "tall", image: "image_1.png", options: ["big", "tall", "short"] },
            
            // 6. Butterfly
            { sentenceBefore: "A butterfly is a ", sentenceAfter: " animal.", correct: "small", image: "image_4.png", options: ["big", "small", "long"] },
            { sentenceBefore: "A butterfly has ", sentenceAfter: " wings.", correct: "big", image: "image_4.png", options: ["short", "big", "tall"] }
        ];

        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        // Sistema de Audio
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function userGestureAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const bgmNotes = [261.63, 329.63, 392.00, 329.63, 349.23, 440.00, 392.00, 329.63];
        let noteIdx = 0;

        function playBgmStep() {
            if (!isBgmPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(bgmNotes[noteIdx], now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            noteIdx = (noteIdx + 1) % bgmNotes.length;
        }

        function toggleGameBGM() {
            initAudio();
            isBgmPlaying = !isBgmPlaying;
            localStorage.setItem('bgmPlaying', isBgmPlaying);
            updateBgmButton();
        }

        function updateBgmButton() {
            const btn = document.getElementById('bgm-btn');
            if (isBgmPlaying) {
                btn.innerText = "🎵 Music: ON";
                btn.classList.replace('bg-pink-500', 'bg-emerald-500');
                if (!bgmInterval) bgmInterval = setInterval(playBgmStep, 250);
            } else {
                btn.innerText = "🎵 Music: OFF";
                btn.classList.replace('bg-emerald-500', 'bg-pink-500');
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAudio();
            if (localStorage.getItem('bgmPlaying') === 'true') {
                isBgmPlaying = true;
                updateBgmButton();
            }
            loadQuestion();
        });

        function playSound(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function loadQuestion() {
            const q = questions[currentIndex];
            document.getElementById('clue').innerHTML = `${q.sentenceBefore}<span class="inline-block border-b-4 border-dashed border-emerald-600 px-3 py-1 bg-yellow-100 rounded-lg text-emerald-800">???</span>${q.sentenceAfter}`;
            
            const img = document.getElementById('animal-photo');
            img.src = q.image;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-slate-100 hover:bg-emerald-100 border-2 border-slate-300 font-bold p-3 rounded-2xl text-slate-700 transition-all text-xl capitalize';
                btn.innerText = opt;
                btn.onclick = (e) => { e.stopPropagation(); checkAnswer(opt, btn); };
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const q = questions[currentIndex];
            const allBtns = document.querySelectorAll('#options-container button');
            allBtns.forEach(b => b.disabled = true);

            const isCorrect = (selected === q.correct);

            document.getElementById('clue').innerHTML = `${q.sentenceBefore}<span class="inline-block border-b-4 border-solid ${isCorrect ? 'border-emerald-600 bg-emerald-200 text-emerald-900' : 'border-rose-600 bg-rose-200 text-rose-900'} px-3 py-1 rounded-lg font-bold">${selected}</span>${q.sentenceAfter}`;

            userAnswers.push({
                fullSentence: `${q.sentenceBefore} [ ${selected} ] ${q.sentenceAfter}`,
                selected: selected,
                correct: q.correct,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                btn.classList.add('bg-emerald-200', 'border-emerald-500', 'text-emerald-900');
                score += 10;
                document.getElementById('score').innerText = score;
                playSound('correct');
            } else {
                btn.classList.add('bg-rose-200', 'border-rose-500', 'text-rose-900');
                playSound('wrong');
                allBtns.forEach(b => {
                    if (b.innerText === q.correct) {
                        b.classList.add('bg-emerald-200', 'border-emerald-500', 'text-emerald-900');
                    }
                });
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('game-card-container').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');
            document.getElementById('final-stars').innerText = score;

            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            userAnswers.forEach((ans, idx) => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl border-2 ${ans.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'} flex justify-between items-center`;
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-xs text-slate-500">Sentence ${idx + 1}</span>
                        <p class="text-base font-bold text-slate-800">${ans.fullSentence}</p>
                        ${!ans.isCorrect ? `<p class="text-xs text-rose-600 mt-0.5">Correct adjective: <b>${ans.correct}</b></p>` : ''}
                    </div>
                    <div class="text-2xl">${ans.isCorrect ? '✅' : '❌'}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        function downloadPDF() {
            const element = document.getElementById('results-view');
            const opt = {
                margin: 10,
                filename: 'Adjectives_Game_Results.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
